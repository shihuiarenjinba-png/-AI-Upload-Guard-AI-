name: Privacy UX and Safety Checks

on:
  push:
    branches:
      - improve/review-gates-20261018
      - 'ui/safe-product-upgrade-20261019'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencies
        run: python -m pip install "pillow" "pypdf>=6,<7"
      - name: Compile and check syntax
        run: python -m compileall -q windows_app.py i18n.py smoke_test.py tests
      - name: Existing functional regression
        run: python smoke_test.py
      - name: Added security and UI helper tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Japanese and English UI smoke
        run: python bilingual_smoke_test.py

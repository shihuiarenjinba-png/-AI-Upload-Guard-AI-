# Group C Windows evidence pipeline. Portable EXE is built first; MSIX uses a separate clean checkout.
# No signing, Store upload, certification submission, or publication is performed.
name: Group C portable prerequisite
on:
  push:
    branches: ['codex/store-p1-ai-upload-guard-20261023']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-portable:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Validate PowerShell syntax before build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $failures = @()
          Get-ChildItem -LiteralPath $PWD -Recurse -File -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($err in @($errors)) {
              $failures += "$($_.FullName):$($err.Extent.StartLineNumber): $($err.Message)"
            }
          }
          if ($failures.Count -gt 0) {
            $failures | ForEach-Object { Write-Error $_ }
            throw "PowerShell syntax validation failed with $($failures.Count) error(s)."
          }
          Write-Host 'POWERSHELL_SYNTAX=PASS'
      - name: Compile Python tests
        shell: pwsh
        run: python -m compileall -q tests
      - name: Use existing Windows portable builder unchanged
        shell: powershell
        run: |
          & .\build-windows-portable.ps1
          if ($LASTEXITCODE -ne 0) { throw "Portable builder reported failure: $LASTEXITCODE" }
      - name: Verify EXE and regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'dist/AIUploadGuard.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "Expected EXE missing: $exe" }
          $python = Join-Path $PWD '.venv-build/Scripts/python.exe'
          if (-not (Test-Path -LiteralPath $python -PathType Leaf)) { throw "Build venv missing: $python" }
          & $python -m pip install 'reportlab>=4.0,<5.0'
          if ($LASTEXITCODE -ne 0) { throw "PDF test fixture dependency install failed: $LASTEXITCODE" }
          & $python -m unittest discover -s tests -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw "Regression suite failed: $LASTEXITCODE" }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash
          $evidence = [ordered]@{
            source_commit = $env:GITHUB_SHA
            source_branch = $env:GITHUB_REF_NAME
            exe_name = 'AIUploadGuard.exe'
            exe_sha256 = $hash
            package_type = 'PORTABLE_EXE_PREREQUISITE_ONLY'
            msix = 'NOT_CREATED'
            partner_center = 'NOT_ACCESSED'
            release = 'HOLD'
          }
          $evidence | ConvertTo-Json -Depth 4 | Out-File -FilePath dist/group-c-exe-evidence.json -Encoding utf8
          Write-Host "EXE_SHA256=$hash"
      - name: Verify packaged Windows EXE self-test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Join-Path $PWD 'dist/AIUploadGuard.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw 'Packaged EXE not found' }
          $proc = Start-Process -FilePath $exe -ArgumentList '--self-test' -PassThru
          try {
            if (-not $proc.WaitForExit(90000)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw 'Packaged EXE self-test timed out'
            }
            if ($proc.ExitCode -ne 0) { throw "Packaged EXE self-test failed: $($proc.ExitCode)" }
            Write-Host 'PACKAGED_EXE_SELF_TEST=PASS'
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }
      - name: Preserve isolated build evidence
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: group-c-prerequisite-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            dist/AIUploadGuard.exe
            dist/group-c-exe-evidence.json
          if-no-files-found: error
          retention-days: 14

  package-unsigned-msix:
    needs: build-portable
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Fresh checkout for clean Store package gate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python for Store validation
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Read committed Store readiness
        id: storegate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $doc = Get-Content -LiteralPath 'store/unsigned_msix_submission_inputs.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $blockers = @()
          foreach ($pair in @(
            @('store_id_verification','PARTNER_CENTER_VERIFIED'),
            @('display_name_verification','PARTNER_CENTER_VERIFIED'),
            @('package_identity_name_verification','PARTNER_CENTER_VERIFIED'),
            @('package_identity_publisher_verification','PARTNER_CENTER_VERIFIED'),
            @('publisher_display_name_verification','PARTNER_CENTER_VERIFIED'),
            @('package_family_name_verification','PARTNER_CENTER_VERIFIED'),
            @('package_sid_verification','PARTNER_CENTER_VERIFIED'),
            @('package_version_approval','OWNER_APPROVED'),
            @('brand_assets_approval','OWNER_APPROVED')
          )) {
            $field = [string]$pair[0]; $expected = [string]$pair[1]
            if ([string]$doc.$field -cne $expected) { $blockers += "$field is not $expected" }
          }
          if ([string]::IsNullOrWhiteSpace([string]$doc.approved_store_version)) { $blockers += 'approved_store_version is missing' }
          foreach ($field in @('partner_center_reserved_display_name','package_identity_name','package_identity_publisher','publisher_display_name')) {
            if ([string]::IsNullOrWhiteSpace([string]$doc.$field)) { $blockers += "$field is missing" }
          }
          $assets = Join-Path $PWD 'store-assets/assets'
          $approvalPath = Join-Path $PWD 'store-assets/approval.json'
          if (-not (Test-Path -LiteralPath $assets -PathType Container)) { $blockers += 'approved asset directory is missing' }
          if (-not (Test-Path -LiteralPath $approvalPath -PathType Leaf)) {
            $blockers += 'store-assets/approval.json is missing'
          } else {
            $approval = Get-Content -LiteralPath $approvalPath -Raw -Encoding UTF8 | ConvertFrom-Json
            if ($approval.status -ne 'OWNER_APPROVED' -or $approval.product_key -ne 'ai-upload-guard') {
              $blockers += 'store-assets approval is not valid for this product'
            }
          }
          $report = [ordered]@{ ready = ($blockers.Count -eq 0); blockers = $blockers; source_commit = $env:GITHUB_SHA; store_version = $doc.approved_store_version }
          $reportPath = Join-Path $env:RUNNER_TEMP 'group-c-msix-preflight.json'
          $report | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $reportPath -Encoding UTF8
          "ready=$($report.ready.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          if (-not $report.ready) {
            Write-Host 'MSIX_STATUS=HOLD'
            $blockers | ForEach-Object { Write-Host "MSIX_BLOCKER=$_" }
          }

      - name: Preserve Store readiness report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: group-c-msix-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/group-c-msix-preflight.json
          if-no-files-found: error
          retention-days: 14
      - name: Download verified portable EXE for QA MSIX
        uses: actions/download-artifact@v8
        with:
          name: group-c-prerequisite-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/group-c-qa-exe

      - name: Generate QA-only placeholder package logos
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $assets = Join-Path $env:RUNNER_TEMP 'group-c-qa-assets'
          New-Item -ItemType Directory -Path $assets -Force | Out-Null
          Add-Type -AssemblyName System.Drawing
          foreach ($spec in @(
            @('StoreLogo.png',50,50),
            @('Square44x44Logo.png',44,44),
            @('Square150x150Logo.png',150,150)
          )) {
            $name = [string]$spec[0]; $w = [int]$spec[1]; $h = [int]$spec[2]
            $bmp = New-Object System.Drawing.Bitmap($w,$h)
            try {
              $g = [System.Drawing.Graphics]::FromImage($bmp)
              try {
                $g.Clear([System.Drawing.Color]::White)
                $pen = New-Object System.Drawing.Pen([System.Drawing.Color]::Black,2)
                try { $g.DrawRectangle($pen,1,1,$w-3,$h-3) } finally { $pen.Dispose() }
              } finally { $g.Dispose() }
              $bmp.Save((Join-Path $assets $name),[System.Drawing.Imaging.ImageFormat]::Png)
            } finally { $bmp.Dispose() }
          }
          Write-Host 'QA_ASSETS=GENERATED_NOT_STORE_APPROVED'

      - name: Build and verify QA-only unsigned MSIX
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $doc = Get-Content -LiteralPath 'store/unsigned_msix_submission_inputs.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $qaVersion = "1.0.$($env:GITHUB_RUN_NUMBER).0"
          $exe = Join-Path $env:RUNNER_TEMP 'group-c-qa-exe/AIUploadGuard.exe'
          $assets = Join-Path $env:RUNNER_TEMP 'group-c-qa-assets'
          & ./store/build-msix.ps1 -IdentityName ([string]$doc.package_identity_name) -Publisher ([string]$doc.package_identity_publisher) -PublisherDisplayName ([string]$doc.publisher_display_name) -DisplayName ([string]$doc.partner_center_reserved_display_name) -AssetsDirectory $assets -ExePath $exe -Version $qaVersion
          if ($LASTEXITCODE -ne 0) { throw "QA MSIX builder reported failure: $LASTEXITCODE" }
          Write-Host "QA_UNSIGNED_VERSION=$qaVersion"
          Write-Host 'STORE_SUBMISSION_AUTHORIZED=FALSE'

      - name: Preserve QA-only MSIX and verification evidence
        uses: actions/upload-artifact@v7
        with:
          name: group-c-QA_UNSIGNED-validation-msix-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist-store/**
          if-no-files-found: error
          retention-days: 30

      - name: Download verified portable EXE
        if: steps.storegate.outputs.ready == 'true'
        uses: actions/download-artifact@v8
        with:
          name: group-c-prerequisite-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/group-c-exe

      - name: Build and verify unsigned Store MSIX candidate
        if: steps.storegate.outputs.ready == 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $doc = Get-Content -LiteralPath 'store/unsigned_msix_submission_inputs.json' -Raw -Encoding UTF8 | ConvertFrom-Json
          $exe = Join-Path $env:RUNNER_TEMP 'group-c-exe/AIUploadGuard.exe'
          $assets = Join-Path $PWD 'store-assets/assets'
          & ./store/build-msix.ps1 -IdentityName ([string]$doc.package_identity_name) -Publisher ([string]$doc.package_identity_publisher) -PublisherDisplayName ([string]$doc.publisher_display_name) -DisplayName ([string]$doc.partner_center_reserved_display_name) -AssetsDirectory $assets -ExePath $exe -Version ([string]$doc.approved_store_version)
          if ($LASTEXITCODE -ne 0) { throw "MSIX builder reported failure: $LASTEXITCODE" }

      - name: Preserve unsigned MSIX candidate evidence
        if: steps.storegate.outputs.ready == 'true' && success()
        uses: actions/upload-artifact@v7
        with:
          name: group-c-QA_UNSIGNED-msix-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist-store/**
          if-no-files-found: error
          retention-days: 30
